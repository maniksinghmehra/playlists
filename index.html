}

* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}

html {
  scrollbar-width: thin;
  scrollbar-color: rgba(255, 255, 255, 0.15) #0b0d10;

body {

body.window-open {

.bg {
  position: fixed;
  inset: -60%;
  z-index: -2;
  filter: blur(50px);
  will-change: transform;
  transform: translateZ(0);
}
.bg::before, .bg::after {
  content: "";
  position: absolute;
  inset: 0;
  will-change: transform;
}
.bg::before {
  background:
    radial-gradient(40% 35% at 20% 30%, rgba(42,47,85,.65), transparent 60%),
    radial-gradient(45% 40% at 80% 40%, rgba(27,58,75,.65), transparent 60%),
    radial-gradient(35% 35% at 50% 80%, rgba(46,27,63,.6), transparent 60%);
  animation: flowA 90s linear infinite;
}
.bg::after {
  background:
    radial-gradient(38% 34% at 30% 60%, rgba(140,40,55,.45), transparent 65%),
    radial-gradient(30% 30% at 70% 20%, rgba(110,30,45,.35), transparent 65%);
  animation: flowB 120s linear infinite;
}
@keyframes flowA { to { transform: rotate(360deg); } }
@keyframes flowB { to { transform: rotate(-360deg); } }

.noise {

  z-index: 9999;
  opacity: 0.05;

  background-size: 120px;
}

.cursor-glow {

  height: 600px;
  margin-left: -300px;
  margin-top: -300px;
  top: 0;
  left: 0;
  background: radial-gradient(circle, rgba(255,255,255,0.06) 0%, rgba(255,255,255,0) 60%);
  border-radius: 50%;

  z-index: -1;

}

.admin-link {

.wrap {

@media (min-width: 1920px) {

header {

}

header h1 {
  font-family: 'Inter', sans-serif;
  font-weight: 600;
  font-size: 2rem;

.playlist-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));

  transform: translateY(30px);
  animation: fadeInUp 0.8s cubic-bezier(0.2, 0.8, 0.2, 1) forwards;

/* Large monitors (1920px+) - 6 per row */
@media (min-width: 1920px) {
  .playlist-grid {
    grid-template-columns: repeat(6, 1fr);
    gap: 40px;
  }
}

/* Desktop/Laptop (1440px-1919px) - 5 per row */
@media (min-width: 1440px) and (max-width: 1919px) {
  .playlist-grid {
    grid-template-columns: repeat(5, 1fr);
    gap: 36px;
  }
}

/* Laptop (1024px-1439px) - 4 per row */

    grid-template-columns: repeat(4, 1fr);

@media (min-width: 768px) and (max-width: 1023px) {

    grid-template-columns: repeat(3, 1fr);

.playlist {
  width: 100%;
  cursor: pointer;
  outline: none;
  position: relative;
  background: transparent;
  border: none;
  text-align: left;
  perspective: 1200px;
  border-radius: 10px;
  -webkit-tap-highlight-color: transparent;
  content-visibility: auto;
  contain-intrinsic-size: 0 360px;
}

.playlist:focus-visible .playlist-inner {
  box-shadow: 0 0 0 2px var(--text);
}

.playlist-inner {
  height: 100%;
  min-height: 0;
  background: var(--card);
  border-radius: 10px;
  border: 1px solid var(--card-border);
  padding: 18px;
  display: flex;
  flex-direction: column;
  text-align: center;
  overflow: hidden;
  position: relative;
  transition: transform 0.1s cubic-bezier(0.2, 0.8, 0.2, 1), box-shadow 0.25s ease, filter 0.25s ease;
  box-shadow:
    0 15px 35px rgba(0,0,0,0.6),
    0 0 80px -10px rgba(160, 40, 60, 0.22);
  transform-style: preserve-3d;
  will-change: transform;
}

.playlist-inner .playlist-art,
.playlist-inner h2,
.playlist-inner .creator,
.playlist-inner .description {
  transform: translateZ(0);
  transition: transform 0.1s cubic-bezier(0.2, 0.8, 0.2, 1);
}

.glare {
  position: absolute;
  top: 0;
  left: 0;
  right: 0;
  bottom: 0;
  background: radial-gradient(circle at 50% 50%, rgba(255,255,255,0.15), transparent 70%);
  opacity: 0;
  mix-blend-mode: overlay;
  pointer-events: none;
  z-index: 50;
  transition: opacity 0.2s ease;
  transform: translateZ(1px);
}

@media (hover: hover) {
  .playlist-grid:has(.playlist:hover) .playlist:not(:hover) .playlist-inner {
    filter: brightness(.45) saturate(.7) blur(.6px);
    box-shadow: 0 10px 20px rgba(0,0,0,0.5);
  }

  .playlist:hover .playlist-inner {
    box-shadow:
      0 25px 50px rgba(0,0,0,0.8),
      0 0 100px -5px rgba(170, 50, 70, 0.35);
  }

  .playlist:hover .glare {
    opacity: 1;
  }
}

.playlist-art {
  width: 100%;
  aspect-ratio: 1/1;
  background-size: cover;
  background-position: center;
  background-repeat: no-repeat;
  border-radius: var(--radius);
  margin-bottom: 14px;
  pointer-events: none;
  box-shadow: 0 10px 20px rgba(0,0,0,0.2);
  background-color: #222;
}

.playlist h2 {
  font-size: 0.92rem;
  font-weight: 600;
  margin-bottom: 4px;
  color: var(--text);
  line-height: 1.35;
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
  text-overflow: ellipsis;
  min-height: 2.6em;
  text-wrap: balance;
}

.playlist .creator {
  font-size: .8rem;
  color: #b5b5b5;
  font-style: italic;
  margin-bottom: 12px;
}

.playlist .description {
  font-size: .88rem;
  color: #d0d0d0;
  margin-top: 0;
}

.ripple {
  position: absolute;
  border-radius: 50%;
  transform: scale(0);
  animation: ripple-anim 0.6s linear;
  background-color: rgba(255, 255, 255, 0.15);
  pointer-events: none;
  z-index: 100;
}

@keyframes ripple-anim {
  to { transform: scale(4); opacity: 0; }
}

.review-overlay {
  position: fixed;
  inset: 0;
  background: radial-gradient(120% 120% at 50% 50%, rgba(0,0,0,.15), rgba(0,0,0,.65));
  backdrop-filter: blur(38px) saturate(.85);
  -webkit-backdrop-filter: blur(38px) saturate(.85);
  z-index: 50;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.4s ease;
}

.review-overlay.active {
  opacity: 1;
  pointer-events: auto;
}

.review-window {
  position: absolute;
  top: 50%;
  left: 50%;
  width: min(900px, 94vw);
  max-height: 88vh;
  background: linear-gradient(180deg, rgba(255,255,255,.12), rgba(255,255,255,.03) 35%, rgba(0,0,0,.35) 100%);
  backdrop-filter: blur(34px) saturate(1.1);
  -webkit-backdrop-filter: blur(34px) saturate(1.1);
  border-radius: 28px;
  border: 1px solid rgba(255,255,255,.14);
  padding: 48px;
  padding-bottom: 80px;
  overflow-y: auto;
  overscroll-behavior: contain;
  box-shadow: inset 0 1px 0 rgba(255,255,255,.25), inset 0 -40px 60px rgba(0,0,0,.45), 0 60px 140px rgba(0,0,0,.9);
  will-change: transform, opacity;
  transform: translate(-50%, -50%) scale(0.94);
  transition: transform 0.3s cubic-bezier(0.25, 0.1, 0.25, 1), opacity 0.3s ease;
  outline: none;
}

.review-overlay.active .review-window {
  opacity: 1;
  transform: translate(-50%, -50%) scale(1);
  transition: transform 0.5s cubic-bezier(0.18, 0.89, 0.32, 1.15), opacity 0.5s ease;
}

.rw-content > * {
  opacity: 0;
  transform: translateY(15px);
  transition: opacity 0.5s ease, transform 0.5s cubic-bezier(0.2, 0.8, 0.2, 1);
}

.review-overlay.active .rw-content > * {
  opacity: 1;
  transform: translateY(0);
}

.review-overlay.active h3 { transition-delay: 0.1s; }
.review-overlay.active .rw-creator { transition-delay: 0.2s; }
.review-overlay.active .rw-text { transition-delay: 0.3s; }

.rw-grid {

  grid-template-columns: 260px 1fr;
  gap: 48px;
  align-items: stretch;
}

.review-window h3 {
  font-size: 1.6rem;

  margin-bottom: 6px;
}

.review-window .rw-creator {
  color: var(--muted);

}

.review-window .rw-text {

  max-width: 65ch;
  margin-top: 0;
  opacity: 0.95;
}

.rw-content {
  display: flex;
  flex-direction: column;
  min-height: 100%;
}

.rw-actions {
  margin-top: auto;
  padding-top: 24px;
  border-top: 1px solid rgba(255, 255, 255, 0.14);

.btn {
  text-decoration: none;
  padding: 12px 24px;
  border-radius: 50px;
  font-size: 0.85rem;
  font-weight: 500;
  transition: transform 0.2s ease, filter 0.2s ease, background 0.2s ease;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  background: rgba(255,255,255,0.08);
  color: #eaeaea;
  border: 1px solid rgba(255,255,255,0.1);

}

.btn:hover {
  transform: translateY(-2px);
  filter: brightness(1.2);
  background: rgba(255,255,255,0.15);
  border-color: rgba(255,255,255,0.2);
}

.btn:active { transform: translateY(0); }
.btn:focus-visible { outline: 2px solid white; outline-offset: 2px; }

.close-btn {
  position: absolute;
  top: 28px;
  right: 28px;
  width: 36px;
  height: 36px;
  background: transparent;
  border: none;
  cursor: pointer;
  color: var(--muted);
  opacity: 0.6;
  transition: transform 0.4s cubic-bezier(0.2, 0.8, 0.2, 1), opacity 0.3s ease, color 0.3s ease;
  z-index: 10;

  justify-content: center;
}

.close-btn svg { width: 24px; height: 24px; display: block; }
.close-btn:hover { opacity: 1; color: var(--text); transform: rotate(90deg) scale(1.1); }
.close-btn:active { transform: rotate(90deg) scale(0.95); }
.close-btn:focus-visible { outline: 2px solid white; opacity: 1; }

.rw-visual img {
  width: 100%;

  object-fit: cover;
  border-radius: 12px;
  box-shadow: 0 25px 50px rgba(0,0,0,0.5), 0 0 0 1px rgba(255,255,255,0.1);

@keyframes fadeInUp {
  to { opacity: 1; transform: translateY(0); }

const defaultYoutubePlaylistUrl = "https://music.youtube.com/playlist?list=YOUR_PLAYLIST_ID";
playlists.forEach(playlist => {
  if (!playlist.youtube) {
    playlist.youtube = defaultYoutubePlaylistUrl;
  }
});

const escapeHtml = (value) => String(value)
  .replaceAll("&", "&amp;")
  .replaceAll("<", "&lt;")
  .replaceAll(">", "&gt;")
  .replaceAll('"', "&quot;")
  .replaceAll("'", "&#039;");

const localPlaceholderCover = (cover) => {
  if (!cover.startsWith("https://via.placeholder.com/")) return cover;
  const url = new URL(cover);
  const color = `#${url.pathname.split("/")[3] || "222222"}`;
  const text = url.searchParams.get("text") || "";
  const svg = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300"><rect width="300" height="300" fill="${color}"/><text x="150" y="164" text-anchor="middle" fill="#ffffff" font-family="Arial,sans-serif" font-size="72">${text}</text></svg>`;
  return `data:image/svg+xml,${encodeURIComponent(svg)}`;
};

const createPlaylistCard = (playlist) => {
  const article = document.createElement('article');
  article.className = 'playlist';
  article.tabIndex = 0;
  article.setAttribute('role', 'button');

  article.dataset.title = playlist.title;
  article.dataset.creator = playlist.creator;
  article.dataset.description = playlist.fullDescription;
  article.dataset.spotify = playlist.spotify || "#";
  article.dataset.apple = playlist.apple || "#";
  article.dataset.youtube = playlist.youtube || "#";

  article.innerHTML = `
    <div class="playlist-inner">
      <div class="glare"></div>
      <div class="playlist-art" data-cover="${escapeHtml(localPlaceholderCover(playlist.cover))}"></div>
      <h2>${escapeHtml(playlist.title)}</h2>
      <div class="creator">${escapeHtml(playlist.creator)}</div>
      <div class="description">${escapeHtml(playlist.description)}</div>
    </div>
  `;
  return article;
};

const renderPlaylists = () => {
  const container = document.getElementById('playlist-container');
  container.replaceChildren();
  playlists.forEach(playlist => {
    const card = createPlaylistCard(playlist);
    container.appendChild(card);
  });
};

renderPlaylists();

const loadCover = card => {
  const art = card.querySelector('.playlist-art');
  if (!art || art.dataset.loaded === 'true') return;
  art.style.backgroundImage = `url('${art.dataset.cover}')`;
  art.dataset.loaded = 'true';
};

const coverObserver = 'IntersectionObserver' in window
  ? new IntersectionObserver(entries => {
      entries.forEach(entry => {
        if (entry.isIntersecting) {
          loadCover(entry.target);
          coverObserver.unobserve(entry.target);
        }
      });
    }, { rootMargin: '400px 0px' })
  : null;

document.querySelectorAll('.playlist').forEach(card => {
  if (coverObserver) coverObserver.observe(card);
  else loadCover(card);
});

const overlay = document.getElementById('overlay');
const closeBtn = document.getElementById('close-btn');
const windowEl = document.getElementById('review-window');
const titleEl = document.getElementById('rw-title');
const creatorEl = document.getElementById('rw-creator');
const textEl = document.getElementById('rw-text');
const spotifyBtn = document.querySelector('.btn.primary');
const appleBtn = document.querySelector('.btn.secondary');
const youtubeBtn = document.querySelector('.btn.youtube');
const rwImg = document.getElementById('rw-img');
let lastFocusedElement;

const openModal = (playlist) => {
  lastFocusedElement = playlist;

  titleEl.textContent = playlist.dataset.title;
  creatorEl.textContent = playlist.dataset.creator;
  textEl.innerHTML = playlist.dataset.description;

  const cardArtDiv = playlist.querySelector('.playlist-art');
  loadCover(playlist);
  rwImg.src = cardArtDiv.dataset.cover || "";

  spotifyBtn.href = playlist.dataset.spotify || '#';
  appleBtn.href = playlist.dataset.apple || '#';
  youtubeBtn.href = playlist.dataset.youtube || '#';

  windowEl.scrollTop = 0;

  overlay.classList.add('active');
  document.body.classList.add('window-open');

  setTimeout(() => closeBtn.focus(), 50);
};

const closePanel = () => {
  overlay.classList.remove('active');
  document.body.classList.remove('window-open');
  if (lastFocusedElement) lastFocusedElement.focus();
};

const trapFocus = (e) => {
  if (!overlay.classList.contains('active')) return;

  const focusableElements = windowEl.querySelectorAll(
    'button, [href], input, select, textarea, [tabindex]:not([tabindex="-1"])'
  );
  const firstElement = focusableElements[0];
  const lastElement = focusableElements[focusableElements.length - 1];

  if (e.key === 'Tab') {
    if (e.shiftKey) {
      if (document.activeElement === firstElement) {
        e.preventDefault();
        lastElement.focus();
      }
    } else {
      if (document.activeElement === lastElement) {
        e.preventDefault();
        firstElement.focus();
      }
    }
  }
};

document.addEventListener('click', (e) => {
  const playlist = e.target.closest('.playlist');
  if (playlist) openModal(playlist);
});

document.addEventListener('keydown', (e) => {
  const playlist = e.target.closest('.playlist');
  if (playlist && (e.key === 'Enter' || e.key === ' ')) {
    e.preventDefault();
    openModal(playlist);
  }

  if (overlay.classList.contains('active')) {
      if(e.key === 'Escape') closePanel();
      trapFocus(e);
  }
});

closeBtn.addEventListener('click', closePanel);
overlay.addEventListener('click', e => {
  if(e.target === overlay) closePanel();
});

const isDesktop = window.matchMedia("(min-width: 769px) and (hover: hover)").matches;

if (isDesktop) {
    const cursor = document.getElementById('cursor-glow');
    let mouseX = 0, mouseY = 0;
    let currentX = 0, currentY = 0;
    let isCursorTicking = false;

    document.addEventListener('mousemove', (e) => {
        mouseX = e.clientX;
        mouseY = e.clientY;

        if (!isCursorTicking) {
            window.requestAnimationFrame(animateCursor);
            isCursorTicking = true;
        }
    });

    const animateCursor = () => {
        currentX += (mouseX - currentX) * 0.15;
        currentY += (mouseY - currentY) * 0.15;

        if (cursor) {
           cursor.style.transform = `translate3d(${currentX}px, ${currentY}px, 0)`;
        }

        if (Math.abs(mouseX - currentX) > 0.1 || Math.abs(mouseY - currentY) > 0.1) {
             window.requestAnimationFrame(animateCursor);
        } else {
             isCursorTicking = false;
        }
    };

    const cards = document.querySelectorAll('.playlist');

    cards.forEach(card => {
        let bounds;
        const inner = card.querySelector('.playlist-inner');
        const glare = card.querySelector('.glare');
        const art = card.querySelector('.playlist-art');
        const textElements = card.querySelectorAll('h2, .creator, .description');
        let cardTicking = false;
        let cardMouseX = 0;
        let cardMouseY = 0;

        const updateTilt = () => {
            if (!bounds) {
                cardTicking = false;
                return;
            }

            const x = cardMouseX - bounds.left;
            const y = cardMouseY - bounds.top;

            const xRotation = -((y - bounds.height / 2) / 10);
            const yRotation = ((x - bounds.width / 2) / 10);

            inner.style.transform = `perspective(1000px) rotateX(${xRotation}deg) rotateY(${yRotation}deg) translateY(-5px)`;

            if(glare) {
                const glareX = (x / bounds.width) * 100;
                const glareY = (y / bounds.height) * 100;
                glare.style.background = `radial-gradient(circle at ${glareX}% ${glareY}%, rgba(255,255,255,0.25), transparent 50%)`;
            }

            if(art) art.style.transform = `translateZ(30px) scale(1.02)`;
            textElements.forEach(el => el.style.transform = `translateZ(20px)`);

            cardTicking = false;
        };

        card.addEventListener('mouseenter', () => {
            bounds = card.getBoundingClientRect();
            inner.style.willChange = 'transform';
        });

        card.addEventListener('mousemove', (e) => {
            cardMouseX = e.clientX;
            cardMouseY = e.clientY;

            if (!cardTicking) {
                window.requestAnimationFrame(updateTilt);
                cardTicking = true;
            }
        });

        card.addEventListener('mouseleave', () => {
            inner.style.transform = 'perspective(1000px) rotateX(0) rotateY(0) translateY(0)';
            inner.style.willChange = 'auto';
            if(art) art.style.transform = 'translateZ(0) scale(1)';
            textElements.forEach(el => el.style.transform = 'translateZ(0)');
            bounds = null;
            cardTicking = false;
        });
    });

} else {
    const cursor = document.getElementById('cursor-glow');
    if(cursor) cursor.style.display = 'none';
}

document.addEventListener('click', function(e) {
  const card = e.target.closest('.playlist');
  if (card) {
    if (navigator.vibrate) navigator.vibrate(8);
    const inner = card.querySelector('.playlist-inner');
    const rect = inner.getBoundingClientRect();
    const circle = document.createElement('span');
    const diameter = Math.max(rect.width, rect.height);
    const radius = diameter / 2;
    circle.style.width = circle.style.height = `${diameter}px`;
    circle.style.left = `${e.clientX - rect.left - radius}px`;
    circle.style.top = `${e.clientY - rect.top - radius}px`;
    circle.classList.add('ripple');
    const existing = inner.getElementsByClassName('ripple')[0];
    if (existing) existing.remove();
    inner.appendChild(circle);
  }
});
</script>
