<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Playlist Admin</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: Inter, Arial, sans-serif;
      background: #0b0d10;
      color: #eaeaea;
    }

    body {
      min-height: 100vh;
      margin: 0;
      padding: 20px;
      background: #0b0d10;
    }

    h1 { margin-bottom: 8px; }
    p { color: rgba(234, 234, 234, .65); }

    .login-screen {
      min-height: calc(100vh - 40px);
      display: grid;
      place-items: center;
    }

    .login-card {
      width: min(100%, 380px);
      padding: 28px;
      border: 1px solid rgba(255, 255, 255, .12);
      border-radius: 14px;
      background: rgba(22, 24, 28, .92);
      box-shadow: 0 18px 60px rgba(0, 0, 0, .35);
    }

    .login-card h1 { margin-bottom: 8px; }

    .login-card button {
      width: 100%;
      margin-top: 14px;
    }

    #admin-shell {
      max-width: 760px;
      margin: 0 auto;
      padding: 20px 0 40px;
    }

    form {
      display: grid;
      gap: 14px;
      margin-top: 28px;
    }

    label {
      display: grid;
      gap: 6px;
      font-size: .85rem;
      color: rgba(234, 234, 234, .8);
    }

    input, textarea, button {
      font: inherit;
      border: 1px solid rgba(255, 255, 255, .16);
      border-radius: 8px;
      padding: 11px 12px;
    }

    input, textarea {
      color: #fff;
      background: rgba(255, 255, 255, .07);
    }

    textarea { min-height: 90px; resize: vertical; }

    button {
      color: #fff;
      background: #3d526b;
      cursor: pointer;
    }

    button:hover { filter: brightness(1.2); }

    .links {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      margin-top: 24px;
    }

    .links a { color: #b7d7ff; }
    #status { min-height: 1.5em; color: #9fdbad; }
    #saved-list { padding-left: 20px; }
    #saved-list li { margin: 10px 0; }
    #saved-list button { margin-left: 8px; padding: 5px 9px; }
  </style>
</head>
<body>
  <main class="login-screen" id="login-panel">
    <div class="login-card">
      <h1>Admin access</h1>
      <p>Enter the password to open the playlist admin page.</p>
      <label>Admin password
        <input id="login-password" type="password" autocomplete="current-password" required autofocus>
      </label>
      <button id="login-button" type="button">Enter admin page</button>
      <p id="login-status" role="status"></p>
    </div>
  </main>

  <main id="admin-shell" hidden>
    <h1>Playlist Admin</h1>
    <p>Fill in the playlist details and choose a cover image. Saving publishes the playlist to the live site.</p>

    <div id="admin-content">
      <form id="playlist-form">
        <label>Title
          <input name="title" required>
        </label>
        <label>Creator
          <input name="creator" value="Manik Singh Mehra" required>
        </label>
        <label>Cover image
          <input name="coverFile" type="file" accept="image/jpeg,image/png,image/webp" required>
        </label>
        <label>Spotify link
          <input name="spotify" type="url" placeholder="https://open.spotify.com/playlist/...">
        </label>
        <label>Apple Music link
          <input name="apple" type="url" placeholder="https://music.apple.com/...">
        </label>
        <label>YouTube Music link
          <input name="youtube" type="url" placeholder="https://music.youtube.com/playlist?...">
        </label>
        <label>Short description
          <textarea name="description" required></textarea>
        </label>
        <label>Full description
          <textarea name="fullDescription" required></textarea>
        </label>
        <button type="submit">Add playlist to my site</button>
      </form>

      <p id="status" role="status"></p>
      <h2>Added playlists</h2>
      <ul id="saved-list"></ul>
      <div class="links">
        <a href="index.html">Open main playlist site</a>
      </div>
    </div>
  </main>

  <script>
    const form = document.getElementById("playlist-form");
    const status = document.getElementById("status");
    const savedList = document.getElementById("saved-list");
    const loginPanel = document.getElementById("login-panel");
    const loginPassword = document.getElementById("login-password");
    const loginButton = document.getElementById("login-button");
    const loginStatus = document.getElementById("login-status");
    const adminShell = document.getElementById("admin-shell");
    const passwordStorageKey = "playlist-admin-password";

    const verifyPassword = async (password) => {
      const response = await fetch("/api/publish.js", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ action: "verify", adminPassword: password })
      });
      if (!response.ok) {
        const error = await response.json().catch(() => ({}));
        throw new Error(error.error || "Invalid admin password.");
      }
    };

    const unlockAdmin = async () => {
      const password = loginPassword.value;
      if (!password) {
        loginStatus.textContent = "Enter the admin password.";
        return;
      }

      loginButton.disabled = true;
      loginStatus.textContent = "Checking password...";
      try {
        await verifyPassword(password);
        sessionStorage.setItem(passwordStorageKey, password);
        loginPanel.hidden = true;
        loginStatus.textContent = "";
        adminShell.hidden = false;
      } catch (error) {
        sessionStorage.removeItem(passwordStorageKey);
        loginStatus.textContent = error.message;
        loginPassword.select();
      } finally {
        loginButton.disabled = false;
      }
    };

    loginButton.addEventListener("click", unlockAdmin);
    loginPassword.addEventListener("keydown", event => {
      if (event.key === "Enter") unlockAdmin();
    });

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      const password = sessionStorage.getItem(passwordStorageKey);
      if (!password) {
        loginPanel.hidden = false;
        adminShell.hidden = true;
        loginPassword.focus();
        return;
      }

      const file = form.elements.coverFile.files[0];
      if (!file) {
        status.textContent = "Choose a cover image.";
        return;
      }

      try {
        const coverData = await new Promise((resolve, reject) => {
          const reader = new FileReader();
          reader.onload = () => resolve(String(reader.result).split(",")[1]);
          reader.onerror = () => reject(new Error("Could not read cover image."));
          reader.readAsDataURL(file);
        });
        const values = Object.fromEntries(new FormData(form));
        delete values.adminPassword;
        delete values.coverFile;
        const response = await fetch("/api/publish.js", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ playlist: values, image: coverData, imageType: file.type, adminPassword: password })
        });
        if (!response.ok) {
          const error = await response.json().catch(() => ({}));
          if (response.status === 401) {
            sessionStorage.removeItem(passwordStorageKey);
            loginPanel.hidden = false;
            adminShell.hidden = true;
            loginPassword.focus();
          }
          throw new Error(error.error || `Publish failed (${response.status})`);
        }

        const playlist = await response.json();
        form.reset();
        form.elements.creator.value = "Manik Singh Mehra";
        status.textContent = `Published ${playlist.title}. Vercel will deploy the update shortly.`;
        savedList.innerHTML = `<li>${playlist.title} (${playlist.cover})</li>`;
      } catch (error) {
        status.textContent = error.message;
      }
    });

    const existingPassword = sessionStorage.getItem(passwordStorageKey);
    if (existingPassword) {
      verifyPassword(existingPassword)
        .then(() => {
          loginPanel.hidden = true;
          adminShell.hidden = false;
        })
        .catch(() => sessionStorage.removeItem(passwordStorageKey));
    }
  </script>
</body>
</html>
