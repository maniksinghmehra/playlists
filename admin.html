<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <link rel="icon" type="image/png" sizes="any" href="/tt.png?v=2">
  <link rel="shortcut icon" type="image/png" href="/tt.png?v=2">
  <link rel="apple-touch-icon" sizes="180x180" href="/tt.png?v=2">
  <title>Playlist Admin</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: Inter, Arial, sans-serif;
      background: #0b0d10;
      color: #eaeaea;
      -webkit-text-size-adjust: 100%;
    }

    * { box-sizing: border-box; }

    body {
      min-height: 100vh;
      margin: 0;
      padding: max(16px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right))
        max(16px, env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left));
      background: #0b0d10;
    }

    [hidden] { display: none !important; }

    h1 { margin-bottom: 8px; }
    h1, h2 { line-height: 1.2; }
    p { color: rgba(234, 234, 234, .65); }

    .login-screen {
      min-height: calc(100svh - 32px);
      display: grid;
      place-items: center;
      padding: 16px 0;
    }

    .login-card {
      width: min(100%, 380px);
      padding: clamp(22px, 5vw, 32px);
      border: 1px solid rgba(255, 255, 255, .12);
      border-radius: 14px;
      background: rgba(22, 24, 28, .92);
      box-shadow: 0 18px 60px rgba(0, 0, 0, .35);
    }

    .login-card h1 { margin-bottom: 8px; }

    .login-card button {
      width: 100%;
      margin-top: 14px;
    }

    #admin-shell {
      width: min(100%, 760px);
      margin: 0 auto;
      padding: clamp(8px, 3vw, 20px) 0 40px;
    }

    form {
      display: grid;
      gap: 14px;
      margin-top: 28px;
    }

    label {
      display: grid;
      gap: 6px;
      font-size: .85rem;
      color: rgba(234, 234, 234, .8);
    }

    input, textarea, button {
      font: inherit;
      width: 100%;
      border: 1px solid rgba(255, 255, 255, .16);
      border-radius: 8px;
      padding: 11px 12px;
      min-height: 46px;
    }

    input, textarea {
      color: #fff;
      background: rgba(255, 255, 255, .07);
      font-size: 16px;
    }

    textarea { min-height: 110px; resize: vertical; }

    button {
      color: #fff;
      background: #3d526b;
      cursor: pointer;
      touch-action: manipulation;
    }

    button:hover { filter: brightness(1.2); }
    button:disabled { opacity: .65; cursor: wait; }
    .submit-button {
      position: relative;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 9px;
      overflow: hidden;
      transition: background .2s ease, transform .2s ease, opacity .2s ease;
    }

    .submit-button:not(:disabled):active {
      transform: scale(.985);
    }

    .submit-button.is-loading {
      background: #526f93;
    }

    .submit-button.is-success {
      background: #28734f;
    }

    .submit-spinner {
      display: none;
      width: 16px;
      height: 16px;
      border: 2px solid rgba(255, 255, 255, .35);
      border-top-color: #fff;
      border-radius: 50%;
      animation: submit-spin .7s linear infinite;
    }

    @keyframes submit-spin {
      to { transform: rotate(360deg); }
    }

    @media (prefers-reduced-motion: reduce) {
      .submit-spinner { animation: none; }
    }

    .submit-button.is-loading .submit-spinner {
      display: inline-block;
    }

    input:focus-visible, textarea:focus-visible, button:focus-visible {
      outline: 2px solid #b7d7ff;
      outline-offset: 2px;
    }

    .links {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      margin-top: 24px;
    }

    .links a { color: #b7d7ff; }
    #status { min-height: 1.5em; color: #9fdbad; }
    #login-status { min-height: 1.5em; margin-bottom: 0; }
    #saved-list { padding-left: 20px; }
    #saved-list li { margin: 10px 0; }
    #saved-list button { margin-left: 8px; padding: 5px 9px; }

    @media (min-width: 600px) {
      body { padding-left: 24px; padding-right: 24px; }
      form { gap: 16px; }
    }

    @media (max-width: 599px) {
      body { font-size: 15px; }
      h1 { font-size: clamp(1.65rem, 8vw, 2rem); }
      h2 { font-size: 1.25rem; }
      form { margin-top: 22px; }
      .links { margin-top: 20px; }
    }

    @media (max-width: 380px) {
      body { padding-left: 12px; padding-right: 12px; }
      .login-card { border-radius: 12px; }
    }

    @media (max-height: 520px) and (orientation: landscape) {
      .login-screen { min-height: auto; }
      .login-card { margin: 12px 0; }
    }
  </style>
</head>
<body>
  <main class="login-screen" id="login-panel">
    <div class="login-card">
      <h1>Admin access</h1>
      <p>Enter the password to open the playlist admin page.</p>
      <label>Admin password
        <input id="login-password" type="password" autocomplete="current-password" required autofocus>
      </label>
      <button id="login-button" type="button">Enter admin page</button>
      <p id="login-status" role="status"></p>
    </div>
  </main>

  <main id="admin-shell" hidden>
    <h1>Playlist Admin</h1>
    <p>Fill in the playlist details and choose a cover image. Saving publishes the playlist to the live site.</p>

    <div id="admin-content">
      <form id="playlist-form">
        <label>Title
          <input name="title" required>
        </label>
        <label>Creator
          <input name="creator" value="Manik Singh Mehra" required>
        </label>
        <label>Cover image
          <input name="coverFile" type="file" accept="image/jpeg,image/png,image/webp" required>
        </label>
        <label>Spotify link
          <input name="spotify" type="url" placeholder="https://open.spotify.com/playlist/...">
        </label>
        <label>Apple Music link
          <input name="apple" type="url" placeholder="https://music.apple.com/...">
        </label>
        <label>YouTube Music link
          <input name="youtube" type="url" placeholder="https://music.youtube.com/playlist?...">
        </label>
        <label>Short description
          <textarea name="description" required></textarea>
        </label>
        <label>Full description
          <textarea name="fullDescription" required></textarea>
        </label>
        <button class="submit-button" id="submit-button" type="submit">
          <span class="submit-spinner" aria-hidden="true"></span>
          <span class="submit-label">Add playlist to my site</span>
        </button>
      </form>

      <p id="status" role="status"></p>
      <h2>Added playlists</h2>
      <ul id="saved-list"></ul>
      <div class="links">
        <a href="index.html">Open main playlist site</a>
      </div>
    </div>
  </main>

  <script>
    const form = document.getElementById("playlist-form");
    const status = document.getElementById("status");
    const savedList = document.getElementById("saved-list");
    const loginPanel = document.getElementById("login-panel");
    const loginPassword = document.getElementById("login-password");
    const loginButton = document.getElementById("login-button");
    const loginStatus = document.getElementById("login-status");
    const adminShell = document.getElementById("admin-shell");
    const submitButton = document.getElementById("submit-button");
    const submitLabel = submitButton.querySelector(".submit-label");
    const passwordStorageKey = "playlist-admin-password";

    const showAdminPage = () => {
      loginPanel.hidden = true;
      loginPanel.style.display = "none";
      adminShell.hidden = false;
      adminShell.style.display = "block";
      loginStatus.textContent = "";
    };

    const showLoginPage = () => {
      loginPanel.hidden = false;
      loginPanel.style.display = "grid";
      adminShell.hidden = true;
      adminShell.style.display = "none";
    };

    const verifyPassword = async (password) => {
      const controller = new AbortController();
      const timeout = setTimeout(() => controller.abort(), 10000);
      let response;
      try {
        response = await fetch("/api/verify.js", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ action: "verify", adminPassword: password }),
          signal: controller.signal
        });
      } catch (error) {
        if (error.name === "AbortError") {
          throw new Error("Password verification timed out. Please try again.");
        }
        throw new Error("Could not reach the admin server. Please try again.");
      } finally {
        clearTimeout(timeout);
      }
      if (!response.ok) {
        const error = await response.json().catch(() => ({}));
        throw new Error(error.error || "Invalid admin password.");
      }
    };

    const unlockAdmin = async () => {
      const password = loginPassword.value.trim();
      if (!password) {
        loginStatus.textContent = "Enter the admin password.";
        return;
      }

      loginButton.disabled = true;
      loginStatus.textContent = "Checking password...";
      try {
        await verifyPassword(password);
        sessionStorage.setItem(passwordStorageKey, password);
        showAdminPage();
      } catch (error) {
        sessionStorage.removeItem(passwordStorageKey);
        showLoginPage();
        loginStatus.textContent = error.message;
        loginPassword.select();
      } finally {
        loginButton.disabled = false;
      }
    };

    loginButton.addEventListener("click", event => {
      event.preventDefault();
      unlockAdmin();
    });
    loginPassword.addEventListener("keydown", event => {
      if (event.key === "Enter") unlockAdmin();
    });

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      const password = sessionStorage.getItem(passwordStorageKey);
      if (!password) {
        showLoginPage();
        loginPassword.focus();
        return;
      }

      const file = form.elements.coverFile.files[0];
      if (!file) {
        status.textContent = "Choose a cover image.";
        return;
      }

      try {
        submitButton.disabled = true;
        submitButton.classList.add("is-loading");
        submitLabel.textContent = "Publishing playlist...";
        const coverData = await new Promise((resolve, reject) => {
          const reader = new FileReader();
          reader.onload = () => resolve(String(reader.result).split(",")[1]);
          reader.onerror = () => reject(new Error("Could not read cover image."));
          reader.readAsDataURL(file);
        });
        const values = Object.fromEntries(new FormData(form));
        delete values.adminPassword;
        delete values.coverFile;
        const response = await fetch("/api/publish.js", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ playlist: values, image: coverData, imageType: file.type, adminPassword: password })
        });
        if (!response.ok) {
          const error = await response.json().catch(() => ({}));
          if (response.status === 401) {
            sessionStorage.removeItem(passwordStorageKey);
            showLoginPage();
            loginPassword.focus();
          }
          throw new Error(error.error || `Publish failed (${response.status})`);
        }

        const playlist = await response.json();
        form.reset();
        form.elements.creator.value = "Manik Singh Mehra";
        submitButton.classList.remove("is-loading");
        submitButton.classList.add("is-success");
        submitLabel.textContent = "Playlist published";
        status.textContent = `Published ${playlist.title}. Vercel will deploy the update shortly.`;
        savedList.innerHTML = `<li>${playlist.title} (${playlist.cover})</li>`;
        setTimeout(() => {
          submitButton.classList.remove("is-success");
          submitLabel.textContent = "Add playlist to my site";
          submitButton.disabled = false;
        }, 2200);
      } catch (error) {
        submitButton.disabled = false;
        submitButton.classList.remove("is-loading", "is-success");
        submitLabel.textContent = "Try publishing again";
        status.textContent = error.message;
      }
    });

    const existingPassword = sessionStorage.getItem(passwordStorageKey);
    if (existingPassword) {
      verifyPassword(existingPassword)
        .then(() => {
          showAdminPage();
        })
        .catch(() => sessionStorage.removeItem(passwordStorageKey));
    }
  </script>
</body>
</html>
